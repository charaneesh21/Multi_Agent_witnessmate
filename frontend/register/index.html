<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Your Company</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --border:    #1f2d45;
      --accent:    #3b82f6;
      --accent-h:  #2563eb;
      --text:      #f1f5f9;
      --muted:     #64748b;
      --error:     #ef4444;
      --success:   #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(59,130,246,0.12) 0%, transparent 70%);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .logo span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .alert.error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; display: flex; align-items: center; gap: 0.5rem; }
    .alert.success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3);  color: #86efac; display: flex; align-items: center; gap: 0.5rem; }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface); }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-h); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Admin<span>.</span>Portal</div>
  <p class="subtitle">Register your company to get started</p>

  <div class="alert" id="alert"></div>

  <div class="field">
    <label>Company Name</label>
    <input type="text" id="company_name" placeholder="e.g. Acme Corp" />
  </div>

  <div class="field">
    <label>Industry</label>
    <select id="industry">
      <option value="" disabled selected>Select your industry</option>
      <option>Insurance</option>
      <option>E-Commerce</option>
      <option>Technology</option>
      <option>Education</option>
      <option>Healthcare</option>
      <option>Finance</option>
      <option>Manufacturing</option>
      <option>Other</option>
    </select>
  </div>

  <hr class="divider" />

  <div class="field">
    <label>Admin Email</label>
    <input type="email" id="ceo_email" placeholder="admin@yourcompany.com" />
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="ceo_password" placeholder="Min. 8 characters" />
  </div>

  <button class="btn" id="register-btn" onclick="handleRegister()">Create Account</button>

  <div class="footer">
    Already have an account? <a href="/admin/">Sign in</a>
  </div>
</div>

<script>
  const API = window.location.origin;

  async function handleRegister() {
    const btn     = document.getElementById('register-btn');
    const alert   = document.getElementById('alert');
    const name    = document.getElementById('company_name').value.trim();
    const industry= document.getElementById('industry').value;
    const email   = document.getElementById('ceo_email').value.trim();
    const password= document.getElementById('ceo_password').value;

    // Basic validation
    alert.className = 'alert';
    alert.style.display = 'none';

    if (!name || !industry || !email || !password) {
      showAlert('error', 'All fields are required.');
      return;
    }
    if (password.length < 8) {
      showAlert('error', 'Password must be at least 8 characters.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const res = await fetch(`${API}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          company_name: name,
          industry: industry,
          ceo_email: email,
          ceo_password: password
        })
      });

      const data = await res.json();

      if (res.ok) {
        showAlert('success', '✓ Company registered! Redirecting to sign in...');
        setTimeout(() => window.location.href = '/admin/', 2000);
      } else {
        showAlert('error', data.detail || 'Registration failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    } catch (err) {
      showAlert('error', 'Server error. Is the backend running?');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alert');
    el.className = `alert ${type}`;
    el.textContent = msg;
    el.style.display = 'flex';
  }
</script>

</body>
</html>
